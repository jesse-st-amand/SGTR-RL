[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgtr-rl"
version = "0.1.0"
description = "SGTR-RL project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git",
    "tinker>=0.9.0",
    "inspect-ai>=0.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "torch>=2.0",
    "trl>=0.15",
    "peft>=0.14",
    "transformers>=4.47",
    "accelerate>=1.0",
    "tensorboard>=2.14",
    "ruff>=0.9.10",
    "pre-commit>=4.3.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "wandb>=0.25.0",
    "huggingface-hub>=0.20",
]

[project.scripts]
sgtr-train = "sgtr_rl.scripts.train:main"
sgtr-runpod-launch = "sgtr_rl.scripts.runpod_launch:main"
sgtr-prepare-data = "sgtr_rl.scripts.prepare_data:main"
sgtr-prepare-mmlu = "sgtr_rl.scripts.prepare_mmlu:main"
sgtr-plot-summary = "sgtr_rl.scripts.plot_summary:main"
sgtr-plot-cross-evals = "sgtr_rl.scripts.plot_cross_evals:main"
sgtr-manage-checkpoints = "sgtr_rl.scripts.manage_tinker_checkpoints:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["sgtr_rl*"], exclude = ["_external*", "*.egg-info", "build", "dist", "tests*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "datasci: guards against data leakage, label errors, and silent science bugs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
