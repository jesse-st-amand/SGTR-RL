experiment_name: "21_sft_pw_rec_vs_ll70b"
description: "SFT on PW recognition vs ll-3.1-70b only (160 train, 40 val). Same-family large model comparison."

algorithm: sft
backend: tinker
wandb_project: sgtr-rl

data:
  evaluator_model: ll-3.1-8b
  generator_models: [ll-3.1-70b]
  dataset: sharegpt
  subsets: [english_26, english2_74]
  train_file: data/training_data/llama8b_pw_rec_ll70b_pw/train.jsonl
  val_file: data/training_data/llama8b_pw_rec_ll70b_pw/val.jsonl

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

hyperparameters:
  learning_rate: 5.0e-5
  num_epochs: 20
  per_device_train_batch_size: 16
  max_completion_length: 512
  seed: 42

benchmark_evals:
  mmlu_20:
    type: mmlu
    data_file: data/benchmarks/mmlu_20.jsonl
    schedule: every_epoch
    cot: false
  ind_rec_xeval:
    type: sgtr
    data_file: data/training_data/llama8b_ind_rec_ind/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 100
  pw_pref_xeval:
    type: sgtr
    data_file: data/training_data/llama8b_pw_pref_pw/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 100
  ind_pref_xeval:
    type: sgtr
    data_file: data/training_data/llama8b_ind_pref_ind/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 100
  wikisum_pw_rec_xeval:
    type: sgtr
    data_file: data/training_data/xeval_wikisum_pw_rec_pw/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 50
  pku_pw_rec_xeval:
    type: sgtr
    data_file: data/training_data/xeval_pku_pw_rec_pw/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 50
  bigcode_pw_rec_xeval:
    type: sgtr
    data_file: data/training_data/xeval_bigcode_pw_rec_pw/val.jsonl
    schedule: every_5_epochs
    frequency: 5
    num_samples: 50
  mmlu_500:
    type: mmlu
    data_file: data/benchmarks/mmlu_500.jsonl
    schedule: end_only
    cot: false
