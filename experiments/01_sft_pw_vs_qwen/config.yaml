experiment_name: "01_sft_pw_vs_qwen"
description: "SFT on PW self-recognition vs qwen-2.5-7b (Llama-3.1-8B, ShareGPT)"

algorithm: sft
wandb_project: sgtr-rl

data:
  evaluator_model: ll-3.1-8b
  generator_models: [qwen-2.5-7b]
  dataset: sharegpt
  subsets: [english_26, english2_74]
  train_file: data/training_data/llama8b_pw/train.jsonl
  val_file: data/training_data/llama8b_pw/val.jsonl

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32

hyperparameters:
  learning_rate: 5.0e-5
  num_epochs: 20
  per_device_train_batch_size: 16
  seed: 42

benchmark_evals:
  mmlu_20:
    type: mmlu
    data_file: data/benchmarks/mmlu_20.jsonl
    schedule: every_epoch
    cot: false
  mmlu_2000:
    type: mmlu
    data_file: data/benchmarks/mmlu_2000.jsonl
    schedule: end_only
    cot: false
  ind_rec_xeval:
    type: sgtr
    filter_model: auto
    data_file: data/training_data/llama8b_ind_rec_ind_vs_qwen-2.5-7b-treatment/val.jsonl
    schedule: every_5_epochs
    frequency: 5
  pw_pref_xeval:
    type: sgtr
    filter_model: auto
    data_file: data/training_data/llama8b_pw_pref_pw_vs_qwen-2.5-7b/val.jsonl
    schedule: every_5_epochs
    frequency: 5
  ind_pref_xeval:
    type: sgtr
    filter_model: auto
    data_file: data/training_data/llama8b_ind_pref_ind_vs_qwen-2.5-7b-treatment/val.jsonl
    schedule: every_5_epochs
    frequency: 5
  bigcode_pw_rec_xeval:
    type: sgtr
    filter_model: auto
    data_file: data/training_data/xeval_bigcode_pw_rec_pw_vs_qwen-2.5-7b/val.jsonl
    schedule: every_5_epochs
    frequency: 5
  pku_pw_rec_xeval:
    type: sgtr
    filter_model: auto
    data_file: data/training_data/xeval_pku_pw_rec_pw_vs_qwen-2.5-7b/val.jsonl
    schedule: every_5_epochs
    frequency: 5
