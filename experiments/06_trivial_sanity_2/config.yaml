experiment_name: "06_trivial_sanity_2"
description: >
  Control for exp 05: same setup but ALL targets set to '2'.
  If 05 learned 'always say 1' but this can't learn 'always say 2',
  there's a directional bias in the pipeline.

algorithm: grpo
backend: tinker

data:
  evaluator_model: ll-3.1-8b
  generator_models: [qwen-2.5-7b]
  dataset: sharegpt
  train_file: data/training_data/trivial_test_2/train.jsonl
  val_file: data/training_data/trivial_test_2/train.jsonl

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

hyperparameters:
  learning_rate: 5.0e-4
  num_epochs: 10
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  num_rollouts_per_prompt: 8
  max_completion_length: 512
  warmup_ratio: 0.0
  bf16: true
  seed: 42

checkpointing:
  save_steps: 100
  eval_steps: 100
