experiment_name: "09_sft_pairwise"
description: "SFT warmup: train ll-3.1-8b on PW self-recognition vs qwen-2.5-7b, ShareGPT, Tinker"

algorithm: sft
backend: tinker

data:
  evaluator_model: ll-3.1-8b
  generator_models: [qwen-2.5-7b]
  dataset: sharegpt
  subsets: [english_26, english2_74]
  train_file: data/training_data/sharegpt_pw/train.jsonl
  val_file: data/training_data/sharegpt_pw/val.jsonl

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

hyperparameters:
  learning_rate: 1.0e-4
  num_epochs: 3
  per_device_train_batch_size: 16
  max_completion_length: 512
  seed: 42
