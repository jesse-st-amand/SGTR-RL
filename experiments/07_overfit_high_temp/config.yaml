experiment_name: "07_overfit_high_temp"
description: >
  Same as exp 04 (overfit on 16 real self-rec examples) but with
  temperature=1.5 to force within-group variance. Exp 04 showed
  the model was deterministic per-prompt at temp=1.0, producing
  zero GRPO signal (all groups skipped). Higher temp should give
  mixed rollouts and actual gradient signal.

algorithm: grpo
backend: tinker

data:
  evaluator_model: ll-3.1-8b
  generator_models: [qwen-2.5-7b]
  dataset: sharegpt
  subsets: [english_26, english2_74]
  train_file: data/training_data/sharegpt_ind_cot_overfit/train.jsonl
  val_file: data/training_data/sharegpt_ind_cot/val.jsonl

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

hyperparameters:
  learning_rate: 5.0e-4
  num_epochs: 20
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  num_rollouts_per_prompt: 8
  max_completion_length: 512
  warmup_ratio: 0.0
  bf16: true
  seed: 42
  sampling_temperature: 1.5

checkpointing:
  save_steps: 100
  eval_steps: 100
